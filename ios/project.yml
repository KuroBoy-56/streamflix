# Proyecto de Xcode para la app de iPhone/iPad. Se genera con XcodeGen:
#   brew install xcodegen && cd ios && xcodegen generate && open VODPro.xcodeproj
name: VODPro
options:
  bundleIdPrefix: com.streamlat
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.8.9"
    CURRENT_PROJECT_VERSION: "21"
targets:
  VODPro:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streamlat.garevynvod.ios
        PRODUCT_NAME: VODPro
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Icono del administrador 95925 (como el activity-alias .Admin95925 de Android).
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon95925
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Automatic
schemes:
  VODPro:
    build:
      targets:
        VODPro: all
